; Configuracao propria do agente, separada da API de proposito.
;
; Os testes do agente rodam com `pytest` DENTRO desta pasta e nao sao
; coletados pelo pytest da raiz (que tem `testpaths = tests`). Sao dois
; projetos: um roda no servidor, o outro no computador do balcao, e nada
; obriga os dois a serem instalados na mesma maquina — o agente nem depende
; de FastAPI.

[pytest]
testpaths = tests
pythonpath = .
