; Configuracao do pytest da API.
;
; `testpaths = tests` existe para uma coisa especifica: o repositorio passou
; a ter um segundo projeto Python dentro dele, `print-agent/`, que roda no
; computador do restaurante e nao no servidor. Sem esta linha, um `pytest`
; sem argumentos na raiz varreria o repositorio inteiro e tentaria coletar
; os testes do agente junto com os da API — que e justamente o que o CI nao
; deve fazer. Sao dois ciclos de vida diferentes: a API sobe em container a
; cada merge, o agente e instalado a mao numa maquina Windows.
;
; Os testes do agente rodam por conta propria:
;
;     cd print-agent && pytest
;
; `norecursedirs` cobre o caso de alguem apontar o pytest para a raiz
; explicitamente (`pytest .`), quando `testpaths` deixa de valer.

[pytest]
testpaths = tests
norecursedirs = print-agent .git alembic migrations docs __pycache__ .venv venv

; A RAIZ DO REPOSITORIO NO sys.path. Sem esta linha, `pytest` (o executavel)
; nao encontra o pacote `src` e a suite INTEIRA morre na coleta, nos dois
; jobs, com `ModuleNotFoundError: No module named 'src'`.
;
; O motivo e uma diferenca do PYTHON, nao do pytest. `python -m pytest`
; poe o diretorio atual no `sys.path`; o executavel `pytest` poe o diretorio
; DELE (o `Scripts/` ou `bin/` do ambiente), e mais nada. Quem roda
; `python -m pytest` na raiz nunca ve o problema — e foi por isso que ele
; sobreviveu tanto tempo sem ser notado.
;
; O que faltava para o pytest resolver sozinho: no modo de import padrao
; (`prepend`) ele acrescenta ao `sys.path` o primeiro diretorio ancestral do
; arquivo de teste que NAO tenha `__init__.py`. Como `tests/` nao tem, o que
; entra e `tests/` — e nem `src` nem `tests.fabricas_db` sao alcancaveis a
; partir dali.
;
; `pythonpath` e relativo ao rootdir (o diretorio deste arquivo), e nao ao
; diretorio de onde se chama — entao a entrada aponta para a raiz venha o
; comando de onde vier. Isso NAO quer dizer que a suite rode de qualquer
; lugar: `cd tests && pytest` ainda morre, agora em `ValidationError` do
; Settings, porque `src/core/config.py` declara `env_file=".env"` e o pydantic
; procura esse arquivo relativo ao diretorio ATUAL. Sao dois caminhos
; diferentes, com dois donos diferentes; este arquivo so responde pelo
; primeiro. A suite continua sendo para rodar da raiz.
;
; A alternativa era `tests/__init__.py`, que faria o ancestral sem `__init__`
; virar a raiz. Ficou de fora porque resolve por efeito colateral: o motivo
; some do repositorio, e quem apagasse o arquivo vazio um dia derrubaria a
; suite inteira sem entender por que.
pythonpath = .

; Duas suites, separadas por marcador e nao por diretorio: um teste de
; repositorio quer viver ao lado do teste de service do mesmo assunto.
;
;     pytest -m "not db"   o laco de desenvolvimento, sem Docker aberto
;     pytest               tudo, antes de commitar
;
; `--strict-markers` para que `@pytest.mark.bd` (ou qualquer erro de digitacao
; no nome) seja um erro na coleta, e nao um teste que silenciosamente deixa de
; ser filtrado pelo -m.
addopts = --strict-markers
markers =
    db: precisa do Postgres de teste (docker compose -f docker-compose.test.yml up -d)
