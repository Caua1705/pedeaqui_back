name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: não adianta
# esperar o CI de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Só o ruff: o lint não importa a aplicação, então não precisa do
      # requirements.txt nem de nenhuma variável de ambiente. Instalar tudo
      # aqui só tornaria o job mais lento pelo mesmo resultado.
      - run: pip install ruff==0.16.4

      # Um comando para o repositório inteiro — API e agente de impressão
      # juntos. Ao contrário do pytest, que os separa em dois jobs porque
      # são dois conjuntos de dependências, o ruff não importa nada: só lê.
      #
      # O conjunto de regras é curto e a razão está no ruff.toml. O que
      # importa aqui: este passo nasce VERDE, então qualquer vermelho dele é
      # uma coisa que o commit trouxe.
      - run: ruff check .

  api:
    name: Testes da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão do Dockerfile (python:3.12-slim). CI numa versão e
          # produção em outra faz o verde aqui não valer nada lá.
          python-version: "3.12"
          cache: pip
          # Sem isto o cache do pip continua chaveado pelo `requirements.txt`,
          # que agora quase nao muda — e uma versao nova no lock reaproveitaria
          # o cache da anterior.
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt

      # O lock, pelo mesmo motivo do Dockerfile: CI que resolve versao
      # sozinho testa uma arvore de dependencias que producao nao tem, e o
      # verde daqui deixa de valer la.
      - run: pip install -r requirements.lock.txt -r requirements-dev.txt

      # `src.core.config` é importado na cadeia de qualquer teste, e as
      # variáveis sem default derrubam o import com ValidationError. Os
      # valores são fictícios de propósito: nenhum teste da suíte rápida
      # abre conexão de banco, chama o Google ou fala com o Supabase — eles
      # existem só para o Settings validar.
      #
      # Nenhum segredo real entra no repositório nem em secrets do Actions:
      # se um dia um teste precisar de credencial de verdade, ele não
      # pertence a esta suíte.
      - name: Montar .env de teste
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci
          SUPABASE_URL=https://ci.supabase.invalid
          CUSTOMER_AUTH_SECRET=ci-customer-auth-secret-nao-usar-em-lugar-nenhum
          ADMIN_AUTH_SECRET=ci-admin-auth-secret-nao-usar-em-lugar-nenhum
          EMAIL_CODE_SECRET=ci-email-code-secret-nao-usar-em-lugar-nenhum
          PASSWORD_RESET_SECRET=ci-password-reset-secret-nao-usar-em-lugar-nenhum
          OPENAI_API_KEY=ci-openai-key-fake
          GOOGLE_MAPS_ROUTES_API_KEY=ci-google-key-fake
          APP_ENV=test
          EOF

      # Só a suíte rápida: sem banco, sem rede, é o sinal que precisa voltar
      # em segundos. A marcada `db` é o job abaixo.
      - run: pytest -q -m "not db"

      # O painel gera o cliente dele a partir do openapi.json COMMITADO, e
      # nao mais da API em producao — o documento nao e servido lá, de
      # propósito. Isso troca uma dependência de rede por uma de disciplina,
      # e é este passo que cobra a disciplina: mexeu em rota, schema ou
      # response_model sem regravar o arquivo, o CI para aqui.
      #
      # Roda depois dos testes porque a mensagem de um teste quebrado
      # explica melhor o que aconteceu do que um diff de 300 KB.
      - name: Conferir se o openapi.json acompanha o codigo
        run: python scripts/export_openapi.py --check

      # Dependencia declarada e fora do lock nao entra na imagem: o sintoma
      # seria `ModuleNotFoundError` no boot do container, em producao, depois
      # do deploy. Este passo e o que faz o segundo passo (regerar o lock) ser
      # cobrado em vez de lembrado.
      - name: Conferir se o lock cobre o requirements.txt
        run: python scripts/check_lockfile.py

      # Teste escrito que NAO RODA: VERMELHO, e nao aviso.
      #
      # Em 02/09/2026 um arquivo nasceu com `class OPainelEscreveTests:` — sem
      # prefixo `Test` e sem herdar `TestCase`. O pytest coletou zero casos
      # dela, sem erro e sem aviso: nove testes escritos, revisados e
      # commitados que nunca rodaram. E a familia do dublê de dado e da
      # descoberta vazia — o portao fica verde porque NADA RODOU, e verde por
      # ausencia e indistinguivel de verde por acerto.
      #
      # Nunca houve divida herdada aqui: o unico caso nasceu e morreu no mesmo
      # dia. Zero que cresce e regressao.
      #
      # Quem cobra e `tests/test_testes_mudos.py`, na suite rapida, e ele
      # audita as DUAS suites do repositorio (a da API e a do agente de
      # impressao, cada uma a partir da raiz dela). Este passo so imprime a
      # saida legivel quando algo ja falhou.
      - name: Teste escrito que nao roda (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: |
          python scripts/testes_mudos.py
          python scripts/testes_mudos.py --raiz print-agent

      # Estado que mora no PROCESSO: VERMELHO, e nao aviso.
      #
      # A armadilha 20 diz que nada em memoria sobrevive a mais de um worker,
      # e o `Dockerfile` sobe UM — entao nada disto quebra hoje. E por isso que
      # a classe e perigosa: ela e latente atras de uma linha de configuracao,
      # e no dia de escalar o sintoma depende de qual worker atendeu (sem erro
      # e sem log).
      #
      # Aqui HA divida herdada, ao contrario das outras tres varreduras — mas
      # ela esta DECLARADA com motivo em `ESPERADOS`, e e a lista que serve de
      # linha de base. Sitio novo fora dela e regressao. A regra tinha uma
      # tabela escrita a mao com 3 entradas; a varredura achou 15 sitios.
      #
      # Quem cobra e `tests/test_estado_entre_workers.py`, na suite rapida.
      # `--tudo` imprime tambem o que e proposital, com o que acontece com N
      # workers em cada caso.
      - name: Estado entre workers (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/estado_entre_workers.py --tudo

      # Filtro por EXCLUSAO sobre coluna de enum: VERMELHO, e nao aviso.
      #
      # E a armadilha 47. `visibility != 'private'` — a traducao literal do
      # booleano que virou enum de tres valores — publicava cupom de SEGMENTO
      # na vitrine anonima do cardapio, com codigo, sem erro e sem log. A
      # classe inteira e silenciosa: nao ha sintoma para denunciar um sitio
      # novo, e por isso a revisao tem que ser cobrada e nao lembrada.
      #
      # Ha divida herdada, e ela esta DECLARADA com motivo em `ESPERADOS` —
      # 18 sitios, cada um dizendo para onde cai o valor novo. Sitio novo fora
      # da lista e regressao; entrada da lista que sumir do codigo tambem.
      #
      # Quem cobra e `tests/test_filtros_por_exclusao.py`, na suite rapida.
      # `--tudo` imprime tambem a classificacao de cada sitio declarado.
      - name: Filtro por exclusao sobre enum (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/filtros_por_exclusao.py --tudo

      # Tabela com dado de pessoa fora da exclusao de conta: VERMELHO, e nao
      # aviso.
      #
      # A armadilha 38 cobre a tabela que NAO pende de `customers` — ali a
      # retencao e o mecanismo de exclusao. Esta varredura cobre a outra
      # metade, e o numero certo e ZERO: tabela nova com `customer_id` que o
      # `CustomerAnonymizationService` nao alcance e dado pessoal que a pessoa
      # pediu para apagar e que continua no banco. Nao ha divida herdada aqui.
      #
      # Quem cobra e `tests/test_alcance_da_anonimizacao.py`, na suite rapida;
      # este passo so imprime a classificacao legivel de cada tabela quando
      # algo ja falhou.
      - name: Alcance da exclusao de conta (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/alcance_da_anonimizacao.py --tudo

  banco:
    name: Testes contra o Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        # A MESMA imagem de docker-compose.test.yml. Postgres 17 porque é a
        # major do Supabase, e `pgvector` por uma coluna só —
        # `ai_product_embeddings.embedding` é `vector(1536)` e o
        # schema_baseline.sql não carrega sem o tipo existir.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pedeaqui
          POSTGRES_PASSWORD: pedeaqui
          # O sufixo `_teste` não é enfeite: a fixture recusa apagar o schema
          # de um banco cujo nome não termine assim (tests/conftest.py).
          POSTGRES_DB: pedeaqui_teste
        ports:
          # A porta esquisita é a de docker-compose.test.yml, para o
          # TEST_DATABASE_URL daqui ser igual ao de quem roda na própria
          # máquina. 5432 costuma estar ocupada em máquina de desenvolvimento.
          - 55432:5432
        # Sem isto o pytest começa com o container de pé e o Postgres ainda
        # inicializando, e a falha sai como "connection refused" intermitente.
        options: >-
          --health-cmd "pg_isready -U pedeaqui -d pedeaqui_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt

      # O lock, pelo mesmo motivo do Dockerfile: CI que resolve versao
      # sozinho testa uma arvore de dependencias que producao nao tem, e o
      # verde daqui deixa de valer la.
      - run: pip install -r requirements.lock.txt -r requirements-dev.txt

      # Mesmo .env do job da API, e o DATABASE_URL continua fictício de
      # propósito: quem aponta para o Postgres de verdade é TEST_DATABASE_URL,
      # lido só pela fixture. Se um dia um teste da suíte rápida abrir conexão
      # sem querer, ele falha aqui em vez de passar de carona no banco do
      # vizinho.
      - name: Montar .env de teste
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci
          SUPABASE_URL=https://ci.supabase.invalid
          CUSTOMER_AUTH_SECRET=ci-customer-auth-secret-nao-usar-em-lugar-nenhum
          ADMIN_AUTH_SECRET=ci-admin-auth-secret-nao-usar-em-lugar-nenhum
          EMAIL_CODE_SECRET=ci-email-code-secret-nao-usar-em-lugar-nenhum
          PASSWORD_RESET_SECRET=ci-password-reset-secret-nao-usar-em-lugar-nenhum
          OPENAI_API_KEY=ci-openai-key-fake
          GOOGLE_MAPS_ROUTES_API_KEY=ci-google-key-fake
          APP_ENV=test
          EOF

      # O schema sai da fixture, não de um passo de shell daqui: ela aplica
      # `alembic/schema_baseline.sql`, dá `alembic stamp 20260810_0012` e roda
      # `alembic upgrade head`. Repetir isso em YAML criaria uma segunda
      # versão do procedimento para envelhecer sozinha — e a que quebraria em
      # silêncio é justamente a que ninguém roda na própria máquina.
      - run: pytest -q -m db
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pedeaqui:pedeaqui@localhost:55432/pedeaqui_teste

      # AVISO, NAO FALHA — e `continue-on-error` e o que garante isso: o job
      # fica verde mesmo que este passo estoure, por qualquer motivo.
      #
      # As 41 divergencias entre o `nullable=` do model e o DDL do banco sao
      # herdadas: o schema nasceu a mao no Supabase e o `Base.metadata` foi
      # escrito depois, olhando para tabelas que ja existiam. Nenhuma delas foi
      # introduzida por um commit, e um portao VERMELHO contra divida herdada e
      # um portao que se aprende a ignorar — ate o dia em que ele acusar uma
      # divergencia nova e alguem o desligar para conseguir entregar.
      #
      # O que faltava era so isto: o numero nao crescer calado. Passando de 41,
      # o `::warning::` aparece no Summary do Actions e na PR, com o nome da
      # coluna nova na saida logo acima.
      #
      # O SCHEMA AQUI E O QUE O PASSO ANTERIOR DEIXOU. A fixture
      # `engine_de_teste` apaga e remonta o schema no SETUP e nao o derruba no
      # fim, entao depois de `pytest -m db` o banco esta em head. Nao ha
      # segunda montagem justamente para nao existir uma segunda versao do
      # procedimento para envelhecer sozinha (o mesmo motivo do comentario do
      # passo anterior). Se a suite `db` falhar, `if: always()` faz este passo
      # rodar mesmo assim e o script diz "Nenhuma tabela no schema" — que e um
      # aviso honesto, e nao um numero errado.
      #
      # O limite mora aqui, no YAML, de proposito: mudar o numero esperado vira
      # um diff que alguem revisa.
      - name: Divergencias entre o ORM e o schema (aviso)
        if: always()
        continue-on-error: true
        run: python scripts/divergencias_orm_schema.py --url "$TEST_DATABASE_URL" --limite 41
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pedeaqui:pedeaqui@localhost:55432/pedeaqui_teste

      # A SEGUNDA metade da mesma pergunta, e tambem AVISO.
      #
      # O passo acima conta QUANTAS colunas discordam; este conta em quantos
      # LUGARES o codigo le uma delas como se ela nao pudesse ser nula —
      # leitura que quebra (metodo em cima, comparacao de ordem, argumento de
      # chamada) mais campo de schema declarado sem `| None`, que e por onde a
      # maioria dos 500 nasce.
      #
      # Os dois numeros se movem por motivos diferentes: o de cima muda quando
      # o SCHEMA muda, o de baixo quando o CODIGO muda. Um passo so nao
      # distinguiria "acrescentei uma coluna" de "acrescentei uma leitura".
      #
      # O limite e LINHA DE BASE, nao conta de defeitos: o casamento e por nome
      # de atributo, e `email` ou `created_at` sao colunas de meia duzia de
      # tabelas. Ele responde "entrou leitura nova?" — e essa pergunta so tem
      # valor se o numero nao crescer calado.
      - name: Leituras de coluna nulavel (aviso)
        if: always()
        continue-on-error: true
        # 182 -> 201 em 04/09/2026, com o "entrar com Google". Os 19 pontos
        # novos foram olhados um a um e nenhum e defeito — sao a colisao por
        # NOME que o proprio script avisa: `identity.email` e `ticket.email`
        # sao campos de dataclass (`str`, nunca nulo) e nao `customers.email`;
        # `birth_date=payload.birth_date` vem do Pydantic; o `created_at` de
        # `customer_social_identities` e NOT NULL; e o `password_hash` de
        # `password_is_set` tem `if not customer.password_hash` uma linha
        # acima. O que sobra e `customer.email` nas respostas do Google, que e
        # o MESMO ponto que `customer_service.py` ja tinha na linha de base.
        #
        # 201 -> 206 no mesmo dia, com a exclusao de conta por codigo. Os cinco
        # sao TODOS `customer.email` (pedir o codigo, achar a linha, mandar o
        # e-mail) — a mesma classe que `auth_service.py` ja tem meia duzia de
        # vezes aqui. Se `customers.email` fosse nulo, `GET /customers/me`
        # quebraria muito antes destes cinco pontos.
        #
        # 206 -> 208 com as contas conectadas, e os dois sao falso positivo por
        # NOME: `linked_at=identidade.created_at` le uma coluna que e NOT NULL
        # nos dois lados em `customer_social_identities`, e o `password_hash`
        # de `verify_password` e a UNICA das 16 divergencias com defesa ja
        # escrita — a funcao declara `str | None` e devolve False (armadilha
        # 50). O casamento e por atributo, e o script avisa disso na saida.
        #
        # 208 -> 0 em 05/09/2026, e NAO porque alguem consertou 208 leituras:
        # porque a ENTRADA do varredor esvaziou. A classe "ORM diz NOT NULL,
        # banco aceita NULL" foi a zero com as revisoes de alinhamento (etapas
        # 1 e 2), e e dela que sai a lista de colunas — sem coluna nulavel
        # divergente, nao ha leitura arriscada a apontar.
        #
        # O teto de 208 sobre uma entrada vazia eram 208 pontos de folga: a
        # classe voltando, qualquer numero abaixo de 208 continuaria verde. O
        # zero so e seguro porque a entrada e travada em outro lugar —
        # test_alinhamento_orm_schema.py::test_a_primeira_classe_de_divergencia_foi_a_zero.
        #
        # O passo continua `continue-on-error`. Virar vermelho e decisao com
        # dono, e o argumento mudou de lado agora que a divida foi paga: um
        # portao vermelho sobre zero nao e portao contra divida herdada.
        run: python scripts/leituras_de_coluna_nulavel.py --url "$TEST_DATABASE_URL" --limite 0
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pedeaqui:pedeaqui@localhost:55432/pedeaqui_teste

      # Escopo de tenant: VERMELHO, e nao aviso.
      #
      # Mesma regra dos dubles e do Redis: o numero certo e ZERO. Quem cobra e
      # `tests/test_escopo_das_rotas.py`, na suite rapida; este passo so
      # imprime a tabela legivel quando algo ja falhou — inclusive a coluna
      # `[EBfr]` de cada rota, que e o que se le para achar a que mudou.
      - name: Escopo de tenant das rotas /admin (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/escopo_das_rotas.py --tudo

      # Dado pessoal em chave de Redis: VERMELHO, e nao aviso.
      #
      # Mesma regra dos dubles de dado: aqui o numero certo e ZERO, e zero que
      # cresce nao e divida herdada — e regressao. Quem cobra e
      # `tests/test_dado_pessoal_no_redis.py`, que roda na suite rapida; este
      # passo so imprime a saida legivel quando algo ja falhou.
      - name: Dado pessoal em chave de Redis (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/dados_pessoais_em_chave.py --tudo

      # A terceira, e a unica das tres que e VERMELHO e nao aviso.
      #
      # `dubles_de_dado` ja roda como teste (`tests/test_dubles_de_dado.py`) e
      # continua sendo assim: ali o numero certo e ZERO, e zero que cresce nao
      # e divida herdada — e regressao. As outras duas sao aviso porque a
      # divida existe e foi herdada; esta nao existe mais.
      #
      # Este passo nao repete o teste: ele so imprime a saida legivel quando
      # alguem quiser ver o que o teste vermelho esta dizendo.
      - name: Dubles de dado na suite (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/dubles_de_dado.py

      # Constante do codigo x CHECK de enum do banco: VERMELHO, e nao aviso.
      #
      # E a armadilha 15, mecanizada. Sao duas escritas da mesma lista em
      # lugares que nao se olham — uma revisao do Alembic e um `.py` —, e o
      # sintoma nao aparece em nenhum dos dois: valor so no BANCO faz a filial
      # oferecer a forma de pagamento na tela e o pedido ser recusado na
      # criacao com 400; valor so no CODIGO morre no INSERT.
      #
      # Nunca houve divida herdada: as 23 colunas de enum do banco estao
      # declaradas em `ESPELHOS`, 12 apontando para o conjunto que as espelha
      # e 11 dizendo por que nao ha espelho. Coluna nova fora da lista e
      # regressao.
      #
      # Quem cobra e `tests/test_espelhos_de_enum_db.py`, nesta suite. Este
      # passo so imprime a saida legivel quando algo ja falhou.
      - name: Constante x CHECK de enum (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/espelhos_de_enum.py --url "$TEST_DATABASE_URL" --tudo
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pedeaqui:pedeaqui@localhost:55432/pedeaqui_teste

      # Escrita, commit e camadas: VERMELHO, e nao aviso — pelo mesmo motivo
      # dos dubles. As tres metades de camada (repositorio nao commita, nao
      # levanta, endpoint nao importa repositorio) ja estavam de pe quando o
      # varredor nasceu, e a de atomicidade tambem: o numero nunca foi outro
      # senao zero. Zero que cresce aqui e regressao, e nao divida herdada.
      #
      # Quem cobra e `tests/test_escrita_e_transacao.py`, na suite rapida. Este
      # passo so imprime a saida legivel quando algo ja falhou.
      - name: Escrita, commit e camadas (so a saida legivel)
        if: failure()
        continue-on-error: true
        run: python scripts/escrita_e_transacao.py

  print-agent:
    name: Testes do agente de impressão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: print-agent/requirements-dev.txt

      # Job separado, e não um passo a mais do job da API, porque são dois
      # projetos: o agente não importa FastAPI nem SQLAlchemy, roda no
      # Windows do balcão e não precisa de nenhuma variável de ambiente.
      # Instalar os dois requirements juntos esconderia uma dependência que
      # o agente passou a usar sem declarar.
      #
      # `pywin32` está marcado `sys_platform == "win32"` no requirements, então
      # o pip o pula aqui — os testes do agente rodam sem a fila de impressão.
      - run: pip install -r print-agent/requirements-dev.txt

      - run: pytest -q
        working-directory: print-agent
