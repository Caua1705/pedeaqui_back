[alembic]
# Os scripts de migracao ficam em alembic/versions.
# A pasta migrations/ na raiz e o arquivo historico dos 13 .sql aplicados a
# mao antes da Fase 1; ela esta congelada e nao e lida pelo Alembic.
script_location = alembic

# Prefixo com data para o arquivo ordenar cronologicamente no disco.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# A URL NAO fica aqui: alembic/env.py le de settings.DATABASE_URL para que
# migracao e aplicacao usem exatamente a mesma configuracao e o segredo
# continue apenas no .env.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
