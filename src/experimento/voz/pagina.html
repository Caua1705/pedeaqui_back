<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Experimento de voz — Rapidex</title>
<style>
  /* Feia de proposito. Isto e bancada de teste, nao tela de produto. */
  body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
  h1 { font-size: 18px; }
  input { padding: 6px; width: 340px; font-family: monospace; }
  button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
  #estado { margin: 12px 0; padding: 8px; background: #eee; font-family: monospace; }
  #produtos { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .card { border: 1px solid #999; padding: 10px; width: 200px; }
  .card img { width: 100%; height: 110px; object-fit: cover; background: #ddd; }
  .card .nome { font-weight: bold; margin-top: 6px; }
  .card .preco { color: #060; }
  #log { margin-top: 20px; height: 260px; overflow-y: scroll; background: #111; color: #0f0;
         font-family: monospace; font-size: 11px; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Experimento de voz — Rapidex</h1>
<p>
  <label>restaurant_id: <input id="restaurante" placeholder="cole o uuid do restaurante"></label>
</p>
<p>
  <button id="falar">Falar</button>
  <button id="parar" disabled>Parar</button>
</p>

<div id="estado">parado</div>
<div id="produtos"></div>
<div id="log"></div>

<audio id="audio" autoplay></audio>

<script>
// O log cru de eventos e a parte mais util desta pagina. Os nomes dos eventos
// da Realtime mudam entre versoes da API, e sem ver o que chega de verdade a
// depuracao vira adivinhacao.
const logEl = document.getElementById("log");
const estadoEl = document.getElementById("estado");
const produtosEl = document.getElementById("produtos");

function log(texto) {
  logEl.textContent += texto + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function estado(texto) {
  estadoEl.textContent = texto;
  log("[estado] " + texto);
}

let pc = null;
let canal = null;
let microfone = null;

// ---------------------------------------------------------------------------
// O ESTADO DA RESPOSTA, e por que ele existe
//
// A Realtime aceita UMA resposta em curso por vez. Pedir outra antes de a
// atual fechar devolve `conversation_already_has_active_response`, e foi o
// que aconteceu num teste de voz real com a busca de "sobremesa".
//
// A sequencia de eventos, medida contra a API (modo texto, mesma tool):
//
//     637 ms  response.function_call_arguments.done   call_id=call_7kQ...
//     637 ms  response.output_item.done               call_id=call_7kQ...
//     637 ms  response.done
//
// Duas coisas ficam claras ai. A chamada chega por DOIS eventos, os dois
// carregando `name`, `call_id` e `arguments` completos — entao os dois
// caminhos do handler disparam de verdade. E `response.done` chega DEPOIS
// deles: responder no instante do evento e responder com a resposta ainda
// aberta.
// ---------------------------------------------------------------------------
let respostaAtiva = false;            // o servidor confirmou uma resposta em curso
let pedidoDeRespostaEmVoo = false;    // mandamos response.create, sem response.created ainda
let respostaNaFila = false;           // queremos uma assim que a atual fechar

// Dois conjuntos, com trabalhos diferentes:
const buscasIniciadas = new Set();    // call_id cuja BUSCA ja comecou (nao refazer o fetch)
const resultadosEnviados = new Set(); // call_id cujo RESULTADO ja foi para a API (nao reenviar)

async function comecar() {
  const restaurantId = document.getElementById("restaurante").value.trim();
  if (!restaurantId) { alert("cole o restaurant_id"); return; }

  document.getElementById("falar").disabled = true;
  produtosEl.innerHTML = "";
  zerarEstadoDaConversa();

  estado("pedindo credencial ao backend...");
  const sessaoResp = await fetch("/experimento/voz/sessao", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ restaurant_id: restaurantId })
  });
  if (!sessaoResp.ok) {
    estado("falhou ao emitir credencial: " + sessaoResp.status);
    log(await sessaoResp.text());
    document.getElementById("falar").disabled = false;
    return;
  }
  const sessao = await sessaoResp.json();
  const chaveEfemera = sessao.value;
  log("[sessao] credencial recebida, expira_at=" + sessao.expires_at);

  estado("pedindo o microfone...");
  microfone = await navigator.mediaDevices.getUserMedia({ audio: true });

  pc = new RTCPeerConnection();
  pc.ontrack = (evento) => { document.getElementById("audio").srcObject = evento.streams[0]; };
  pc.addTrack(microfone.getTracks()[0]);

  canal = pc.createDataChannel("oai-events");
  canal.onopen = () => estado("conectado — pode falar");
  canal.onmessage = (evento) => tratarEvento(JSON.parse(evento.data), restaurantId);

  const oferta = await pc.createOffer();
  await pc.setLocalDescription(oferta);

  estado("conectando na OpenAI...");
  const respostaSdp = await fetch("https://api.openai.com/v1/realtime/calls", {
    method: "POST",
    body: oferta.sdp,
    headers: {
      "Authorization": "Bearer " + chaveEfemera,
      "Content-Type": "application/sdp"
    }
  });
  if (!respostaSdp.ok) {
    estado("a OpenAI recusou a conexao: " + respostaSdp.status);
    log(await respostaSdp.text());
    return;
  }
  await pc.setRemoteDescription({ type: "answer", sdp: await respostaSdp.text() });
  document.getElementById("parar").disabled = false;
}

function zerarEstadoDaConversa() {
  respostaAtiva = false;
  pedidoDeRespostaEmVoo = false;
  respostaNaFila = false;
  buscasIniciadas.clear();
  resultadosEnviados.clear();
}

function enviar(objeto) {
  // O canal pode ter fechado enquanto a busca corria — o cliente clicou em
  // Parar, ou a conexao caiu. Mandar num canal fechado levanta excecao dentro
  // de um `async` sem `catch`, e a sessao morre em silencio.
  if (!canal || canal.readyState !== "open") {
    log("[canal] fechado, descartei: " + objeto.type);
    return;
  }
  canal.send(JSON.stringify(objeto));
}

function pedirResposta() {
  if (respostaAtiva || pedidoDeRespostaEmVoo) {
    respostaNaFila = true;
    log("[fila] ja ha resposta ativa; peco quando ela fechar");
    return;
  }
  pedidoDeRespostaEmVoo = true;
  enviar({ type: "response.create" });
}

function enviarResultado(callId, resumo) {
  // A idempotencia que importa: aqui e o unico lugar que fala com a API sobre
  // o resultado, e cada call_id passa por ele uma vez so.
  if (resultadosEnviados.has(callId)) {
    log("[ferramenta] resultado de " + callId + " ja tinha sido enviado, ignorado");
    return;
  }
  resultadosEnviados.add(callId);

  enviar({
    type: "conversation.item.create",
    item: { type: "function_call_output", call_id: callId, output: resumo }
  });
  pedirResposta();
}

function tratarErro(evento) {
  const erro = evento.error || {};
  log("!! " + JSON.stringify(erro));
  pedidoDeRespostaEmVoo = false;

  // A colisao que este bloco existe para consertar. Se ela ainda acontecer,
  // NAO derruba a sessao e NAO entra na fala: o servidor acabou de dizer que
  // ha uma resposta ativa, entao registramos isso e pedimos de novo quando ela
  // fechar.
  if (erro.code === "conversation_already_has_active_response") {
    respostaAtiva = true;
    respostaNaFila = true;
    estado("colisao de resposta — vou pedir de novo quando a atual fechar");
  }
}

function tratarEvento(evento, restaurantId) {
  // Tudo vai para o log; so alguns tipos viram acao.
  if (evento.type !== "response.output_audio_transcript.delta") {
    log("<- " + evento.type);
  }

  if (evento.type === "error") {
    tratarErro(evento);
    return;
  }

  // O ciclo de vida da resposta. `response.created` vale tambem para as
  // respostas que o SERVIDOR cria sozinho quando o cliente para de falar —
  // essas tambem bloqueiam a nossa, e sao a fonte mais provavel de colisao
  // numa conversa de verdade.
  if (evento.type === "response.created") {
    respostaAtiva = true;
    pedidoDeRespostaEmVoo = false;
    return;
  }
  if (evento.type === "response.done") {
    respostaAtiva = false;
    if (respostaNaFila) {
      respostaNaFila = false;
      pedirResposta();
    }
    return;
  }

  // A transcricao do que o modelo falou, so para conferir de olho.
  if (evento.type === "response.output_audio_transcript.done") {
    log("[assistente] " + evento.transcript);
    return;
  }
  if (evento.type === "conversation.item.input_audio_transcription.completed") {
    log("[cliente] " + evento.transcript);
    return;
  }

  // A chamada de ferramenta chega pelos DOIS eventos abaixo, com o mesmo
  // call_id — medido, nao suposto. Os dois continuam sendo tratados porque a
  // API ja mudou esses nomes antes; quem garante uma execucao so e o call_id,
  // nao a escolha de um evento.
  if (evento.type === "response.function_call_arguments.done") {
    executarBusca(evento.call_id, evento.name, evento.arguments, restaurantId);
    return;
  }
  if (evento.type === "response.output_item.done" && evento.item && evento.item.type === "function_call") {
    executarBusca(evento.item.call_id, evento.item.name, evento.item.arguments, restaurantId);
  }
}

async function executarBusca(callId, nome, argumentosJson, restaurantId) {
  if (nome !== "buscar_no_cardapio") { return; }
  // Sem call_id nao ha como devolver o resultado nem como deduplicar — os dois
  // eventos medidos sempre trazem, mas um evento novo da API poderia nao
  // trazer, e ai o Set guardaria `undefined` e deixaria passar o segundo.
  if (!callId) {
    log("!! chamada de ferramenta sem call_id, ignorada");
    return;
  }
  // Sincrono, antes de qualquer `await`: os dois eventos chegam no mesmo
  // milissegundo e o segundo tem que encontrar a marca ja posta.
  if (buscasIniciadas.has(callId)) { return; }
  buscasIniciadas.add(callId);

  let consulta = "";
  let precoMaximo = null;
  try {
    const argumentos = JSON.parse(argumentosJson);
    consulta = argumentos.consulta || "";
    // O modelo so preenche quando o cliente disse um teto.
    precoMaximo = argumentos.preco_maximo ?? null;
  }
  catch (erro) { log("!! argumentos ilegiveis: " + argumentosJson); }

  log("[ferramenta] buscando: " + consulta + (precoMaximo ? " (ate " + precoMaximo + ")" : ""));
  const resposta = await fetch("/experimento/voz/buscar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      restaurant_id: restaurantId,
      consulta: consulta,
      preco_maximo: precoMaximo
    })
  });

  let resultado = { produtos: [], resumo: "A busca falhou." };
  if (resposta.ok) {
    resultado = await resposta.json();
  } else {
    log("!! /buscar respondeu " + resposta.status);
  }

  desenharProdutos(resultado.produtos);
  log("[ferramenta] " + resultado.resumo);

  // Devolve o resultado e pede que o modelo volte a falar. `enviarResultado`
  // cuida das duas coisas que davam errado: mandar o mesmo resultado duas
  // vezes, e pedir resposta nova com uma ainda aberta.
  enviarResultado(callId, resultado.resumo);
}

function desenharProdutos(produtos) {
  produtosEl.innerHTML = "";
  for (const produto of produtos) {
    const card = document.createElement("div");
    card.className = "card";

    if (produto.image_url) {
      const img = document.createElement("img");
      img.src = produto.image_url;
      card.appendChild(img);
    }

    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = produto.name;
    card.appendChild(nome);

    const preco = document.createElement("div");
    preco.className = "preco";
    // O numero da TELA vem daqui, do banco — nunca do que o modelo falou.
    preco.textContent = "R$ " + produto.price.toFixed(2).replace(".", ",");
    card.appendChild(preco);

    produtosEl.appendChild(card);
  }
}

function parar() {
  if (pc) { pc.close(); pc = null; }
  if (microfone) { microfone.getTracks().forEach((t) => t.stop()); microfone = null; }
  // Sem isto, um `respostaAtiva` que ficou true na sessao anterior faria a
  // proxima enfileirar a primeira resposta para sempre.
  zerarEstadoDaConversa();
  document.getElementById("falar").disabled = false;
  document.getElementById("parar").disabled = true;
  estado("parado");
}

document.getElementById("falar").addEventListener("click", () => {
  comecar().catch((erro) => {
    estado("erro: " + erro.message);
    log(String(erro));
    document.getElementById("falar").disabled = false;
  });
});
document.getElementById("parar").addEventListener("click", parar);
</script>

</body>
</html>
