# O commit de que as imagens sao construidas, repetido nos QUATRO servicos que
# constroem (`pedeaqui-api`, `limpeza`, `estorno`, `reindex`).
#
# Repetido, e nao so na API, por um motivo mecanico: os quatro tem `build: .`, e
# `build args` diferentes produzem IMAGENS diferentes. Carimbar so a API faria
# o compose construir a mesma arvore varias vezes, e o worker de reindex — que
# tambem fala com a OpenAI e tambem aparece em investigacao de log — ficaria
# sem a versao.
#
# `${GIT_SHA:-}` com a variavel ausente NAO cai no default do `Dockerfile`, ao
# contrario do que este comentario dizia ate 24/08/2026. Ele expande para
# string vazia, o compose manda `--build-arg GIT_SHA=`, e um valor explicito
# (mesmo vazio) sobrepoe o `ARG GIT_SHA=nao-carimbado`. A imagem nascia com
# `ENV GIT_SHA=""`, o boot escrevia `git_sha=` e o aviso de "imagem sem
# carimbo" ficava mudo — os dois sintomas que apareceram no deploy daquele dia.
#
# Quem normaliza hoje e `Settings._sha_vazio_e_sha_ausente`, e o motivo de
# estar la e nao aqui esta no docstring dele. Este comentario fica para que
# ninguem "simplifique" o validador achando que o `:-` ja resolve.
#
# O deploy que carimba esta em `docs/operacao.md`:
#
#     GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
#
services:
  pedeaqui-api:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: pedeaqui-api
    restart: always
    env_file:
      - .env
    depends_on:
      # Só ordem de partida, não garantia: a API sobe e funciona com o Redis
      # fora do ar (o rate limiter tem `swallow_errors` e o cache de entrega
      # cai para memória). Isto evita apenas o minuto de log de erro a cada
      # `docker compose up`.
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pedeaqui-api.rule=Host(`api.pederapidex.com`)"
      - "traefik.http.routers.pedeaqui-api.entrypoints=websecure"
      - "traefik.http.routers.pedeaqui-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.pedeaqui-api.loadbalancer.server.port=8000"
    networks:
      - n8n_default

  # Expurgo do que venceu: chaves de idempotência e estimativas de entrega.
  #
  # POR QUE UM CONTAINER, E NÃO UM CRON NO HOST. O script já existia desde
  # sempre e, em 12/08/2026, a auditoria encontrou 40 chaves e 216 estimativas
  # em produção — todas vencidas, 39 delas ainda carregando `tracking_token` e
  # o endereço completo do cliente dentro do `response_body`. Ele nunca tinha
  # rodado. Cron no host resolveria igual e teria o mesmo destino: mora fora do
  # repositório, não aparece em `git`, não acompanha o deploy e um servidor
  # novo nasce sem ele. Aqui o expurgo sobe junto com a API e um
  # `docker compose up -d` já o traz.
  #
  # A alternativa era `pg_cron` (o Supabase o tem disponível), agendando o
  # DELETE dentro do banco. Ficou de fora por dois motivos: o agendamento
  # deixaria de ser visível em `docker compose ps`, e a regra de retenção
  # passaria a existir em SQL solto no banco em vez de no script versionado
  # que os testes já cobrem.
  limpeza:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: pedeaqui-limpeza
    restart: always
    env_file:
      - .env
    depends_on:
      # Ordem de partida só. O que importa é que a API já tenha rodado o
      # `alembic upgrade head` antes do primeiro expurgo num servidor novo;
      # se não tiver, o laço abaixo erra, espera 5 min e tenta de novo.
      - pedeaqui-api
    # ENTRYPOINT VAZIO, e isto não é detalhe: o `docker-entrypoint.sh` roda
    # `alembic upgrade head`, e dois containers migrando o mesmo banco ao
    # mesmo tempo é corrida de verdade. Só a API migra.
    entrypoint: []
    # DOIS scripts, e eles são separados de propósito: o primeiro apaga
    # linha vencida (onde um bug custa espaço em disco) e o segundo vence
    # SALDO DE CASHBACK (onde um bug apaga dinheiro de cliente). O motivo
    # inteiro está no docstring de `expire_cashback.py`.
    #
    # Encadeados com `&&`: se a limpeza falhar, a expiração não roda e o
    # laço tenta os dois de novo em 5 min. Rodar a limpeza duas vezes é
    # inofensivo — ela é idempotente — e a ordem inversa faria a expiração
    # depender de um passo que acabou de falhar.
    command:
      - sh
      - -c
      - |
        while true; do
          if python scripts/cleanup_idempotency_keys.py && python scripts/expire_cashback.py; then
            sleep 86400
          else
            echo "[limpeza] falhou; nova tentativa em 5 min"
            sleep 300
          fi
        done
    # Não passa pelo Traefik e não publica porta: ele só fala com o Postgres,
    # pela DATABASE_URL do .env.
    networks:
      - n8n_default

  # As duas varreduras de dinheiro do pedido que acabou mal.
  #
  # A primeira é a rede de segurança do estorno automático. Quem estorna de
  # verdade é o `PaymentRefundService`, na hora do cancelamento; ela só volta
  # no que ficou para trás porque o Mercado Pago não respondeu naquele minuto.
  #
  # A segunda cancela o pedido online cuja cobrança voltou recusada e que
  # ninguém retomou — hoje ele fica em `pending` para sempre, cobrando
  # comissão, segurando o cupom e o cashback do cliente e travando a exclusão
  # de conta. Ela não fala com o gateway em chamada nenhuma (`failed` está
  # fora de PAYMENT_STATUSES_WITH_LIVE_CHARGE), então sai de graça aqui.
  #
  # CONTAINER PRÓPRIO, e não mais uma linha no `limpeza`, por causa da
  # CADÊNCIA. Aquele laço dorme 24h, e o que ele faz é apagar linha vencida —
  # um dia de atraso não custa nada. Aqui o atraso é dinheiro de cliente parado
  # na conta do restaurante, e um cupom que o cliente não consegue reusar por
  # um dia inteiro. Juntar os dois obrigaria a escolher uma cadência errada
  # para um deles.
  estorno:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: pedeaqui-estorno
    restart: always
    env_file:
      - .env
    depends_on:
      - pedeaqui-api
    # ENTRYPOINT VAZIO pelo mesmo motivo do `limpeza`: o
    # `docker-entrypoint.sh` roda `alembic upgrade head`, e só a API migra.
    entrypoint: []
    # 15 min no caminho feliz (que é uma varredura que não acha nada e não
    # gasta chamada nenhuma ao gateway) e 5 min depois de uma falha. Os dois
    # scripts saem com 0 mesmo deixando pedido pendente — de propósito, senão
    # um pedido irrecuperável faria o laço girar em cima dele para sempre. Ver
    # o docstring deles.
    #
    # Encadeados com `&&` como os do `limpeza`, e é seguro pelo mesmo motivo:
    # já que os dois só saem diferente de 0 quando o BANCO não respondeu,
    # `&&` significa "banco fora do ar, tenta os dois em 5 min" — e nunca
    # "o gateway falhou, então o cancelamento não roda".
    command:
      - sh
      - -c
      - |
        while true; do
          if python scripts/estorna_pedidos_cancelados.py && python scripts/cancela_pedidos_sem_pagamento.py; then
            sleep 900
          else
            echo "[estorno] falhou; nova tentativa em 5 min"
            sleep 300
          fi
        done
    networks:
      - n8n_default

  # Mantém o índice do Rapi em dia: produto novo ou editado no painel vira
  # embedding em até um minuto, sem ninguém rodar nada.
  #
  # POR QUE UM CONTAINER PRÓPRIO. A alternativa era o `BackgroundTasks` do
  # FastAPI, dentro da API. Ficaria mais barato de escrever e errado nos dois
  # pontos que importam: a chamada à OpenAI passaria a acontecer dentro do
  # processo que atende pedido (que hoje roda um worker só), e o trabalho
  # morreria com o container — um deploy no meio de uma edição deixaria o
  # produto fora do índice em silêncio, que é exatamente o bug que isto veio
  # consertar.
  #
  # O laço fica DENTRO do Python, ao contrário do container de `limpeza` logo
  # acima. Lá o `sh` repete uma vez por dia; aqui seria um interpretador novo
  # por minuto, recriando o pool de conexões sessenta vezes por hora para, na
  # maioria das vezes, não achar nada.
  reindex:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: pedeaqui-reindex
    restart: always
    env_file:
      - .env
    depends_on:
      # Ordem de partida só, como no `limpeza`. Se o schema ainda não estiver
      # migrado, o primeiro ciclo erra, é logado e o próximo tenta de novo.
      - pedeaqui-api
      - redis
    # ENTRYPOINT VAZIO pelo mesmo motivo do `limpeza`: o `docker-entrypoint.sh`
    # roda `alembic upgrade head`, e dois containers migrando o mesmo banco ao
    # mesmo tempo é corrida de verdade. Só a API migra.
    entrypoint: []
    command: ["python", "scripts/reindex_worker.py"]
    # Não passa pelo Traefik e não publica porta: fala com o Postgres pela
    # DATABASE_URL e com o Redis pelo nome de serviço.
    networks:
      - n8n_default

  # Contadores de rate limit e cache de estimativa de entrega. Sem ele os dois
  # vivem no processo: o limite efetivo vira N x o configurado (um balde por
  # worker) e o cache do Google é perdido a cada deploy, em chamadas pagas.
  #
  # Não expõe porta e não passa pelo Traefik: quem fala com ele é a API, pelo
  # nome de serviço, dentro da rede.
  redis:
    image: redis:7-alpine
    container_name: pedeaqui-redis
    restart: always
    # `requirepass` mesmo sem porta publicada: `n8n_default` é uma rede
    # COMPARTILHADA (o n8n mora nela), e Redis sem senha aceita comando de
    # qualquer container que entre ali — inclusive FLUSHALL.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      - --maxmemory
      - 256mb
      # Todas as chaves que a API grava têm TTL (contador de limite e
      # estimativa de entrega). `volatile-lru` diz exatamente isso: sob
      # pressão, descarta a que expira e não a que ficou.
      - --maxmemory-policy
      - volatile-lru
      # Sem persistência de propósito: os dois usos são cache e janela curta.
      # Um dump em disco só traria contador velho de volta depois de um
      # restart, e o custo do fsync não compra nada aqui.
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
